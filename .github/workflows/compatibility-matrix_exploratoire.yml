name: 🧪 Compatibility Matrix - Exploratoire

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  exploratory:
    name: Java ${{ matrix.java }} / Spring Boot ${{ matrix.spring_boot }}
    runs-on: ubuntu-24.04
    continue-on-error: true

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - java: 21
            spring_boot: 3.2.3
            expected: supported-current

          - java: 24
            spring_boot: 3.2.3
            expected: experimental-old-boot

          - java: 25
            spring_boot: 3.2.3
            expected: experimental-old-boot

          - java: 25
            spring_boot: 4.0.0
            expected: experimental-supported-by-boot4

          - java: 26
            spring_boot: 4.1.0
            expected: experimental-supported-by-boot4.1

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lotodb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lotodb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: mongotest
          MONGO_INITDB_ROOT_PASSWORD: mongotest
          MONGO_INITDB_DATABASE: lotodb_test
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: 🧰 Install tools
        run: sudo apt-get update && sudo apt-get install -y netcat-openbsd postgresql-client

      - name: 🔬 Patch pom.xml temporarily
        run: |
          echo "Modification temporaire du pom.xml dans le runner GitHub Actions uniquement."

          sed -i "s|<java.version>.*</java.version>|<java.version>${{ matrix.java }}</java.version>|g" pom.xml
          sed -i "s|<spring-boot.version>.*</spring-boot.version>|<spring-boot.version>${{ matrix.spring_boot }}</spring-boot.version>|g" pom.xml || true

          grep -n "java.version\|spring-boot.version" pom.xml || true

      - name: ⏳ Wait PostgreSQL
        run: |
          for i in {1..60}; do
            pg_isready -h localhost -p 5432 -U postgres -d lotodb && exit 0
            sleep 2
          done
          exit 1

      - name: ⏳ Wait MongoDB
        run: |
          for i in {1..60}; do
            nc -z localhost 27017 && exit 0
            sleep 2
          done
          exit 1

      - name: 🧪 Exploratory Test
        run: |
          set +e
          mvn -B clean verify \
            -Dspring.profiles.active=ci \
            -Dsurefire.failIfNoSpecifiedTests=false \
            > exploratory.log 2>&1
          CODE=$?

          STATUS="❌ FAILED"
          [ "$CODE" -eq 0 ] && STATUS="✅ OK"

          ROW_FILE="row-java${{ matrix.java }}-springboot${{ matrix.spring_boot }}.md"
          echo "| Java ${{ matrix.java }} | Spring Boot ${{ matrix.spring_boot }} | ${{ matrix.expected }} | $STATUS |" > "$ROW_FILE"
          echo "ROW_FILE=$ROW_FILE" >> "$GITHUB_ENV"
          exit 0
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lotodb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATA_MONGODB_URI: mongodb://mongotest:mongotest@localhost:27017/lotodb_test?authSource=admin

      - name: 📤 Upload row
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: row-java${{ matrix.java }}-springboot${{ matrix.spring_boot }}
          path: ${{ env.ROW_FILE }}

      - name: 📤 Upload log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-java${{ matrix.java }}-springboot${{ matrix.spring_boot }}
          path: exploratory.log

  summary:
    name: 📊 Exploratory Compatibility Table
    runs-on: ubuntu-latest
    needs: exploratory
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: row-*
          path: rows
          merge-multiple: true

      - name: 📊 Build exploratory report
        run: |
          mkdir -p exploratory-report
          {
            echo "# 🧪 Tableau exploratoire Java / Spring Boot"
            echo ""
            echo "| Java | Spring Boot | Statut attendu | Résultat |"
            echo "|---|---|---|---|"
            sort rows/*.md
          } > exploratory-report/exploratory-summary.md

          cat exploratory-report/exploratory-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: exploratory-global-report
          path: exploratory-report/
