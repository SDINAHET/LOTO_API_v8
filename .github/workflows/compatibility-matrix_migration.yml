# name: 🧪 Compatibility Matrix - Migration Exploratoire
name: 🧪 Migration Audit - Java Spring Boot

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  exploratory:
    name: Java ${{ matrix.java }} / Spring Boot ${{ matrix.spring_boot }}
    runs-on: ubuntu-24.04
    continue-on-error: true

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - java: 21
            spring_boot: 3.2.3
            expected: stable-current
            migration_level: production

          - java: 21
            spring_boot: 3.5.0
            expected: minor-upgrade
            migration_level: realistic

          - java: 24
            spring_boot: 3.5.0
            expected: java-future-test
            migration_level: exploratory

          - java: 25
            spring_boot: 4.0.0
            expected: major-upgrade
            migration_level: exploratory

          - java: 26
            spring_boot: 4.1.0
            expected: very-experimental
            migration_level: research

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lotodb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lotodb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: mongotest
          MONGO_INITDB_ROOT_PASSWORD: mongotest
          MONGO_INITDB_DATABASE: lotodb_test
        ports:
          - 27017:27017

    steps:
      - name: 🛠 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        continue-on-error: true
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: 🧰 Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd postgresql-client

      - name: 📁 Prepare report folder
        run: |
          mkdir -p migration-report
          echo "POM actuel : Java 21 / Spring Boot 3.2.3" > migration-report/context.txt
          echo "POM patché : Java ${{ matrix.java }} / Spring Boot ${{ matrix.spring_boot }}" >> migration-report/context.txt
          java -version > migration-report/java-version.txt 2>&1 || true
          mvn -version > migration-report/maven-version.txt 2>&1 || true

      - name: 🔬 Patch pom.xml temporarily
        run: |
          sed -i "s|<java.version>.*</java.version>|<java.version>${{ matrix.java }}</java.version>|g" pom.xml
          sed -i "/<parent>/,/<\/parent>/s|<version>.*</version>|<version>${{ matrix.spring_boot }}</version>|" pom.xml

          cp pom.xml migration-report/pom-patched.xml

          grep -n "spring-boot-starter-parent\|<java.version>\|<version>" pom.xml | head -80 \
            > migration-report/pom-key-versions.txt || true

      - name: ✅ Validate patched pom.xml
        continue-on-error: true
        run: |
          set +e

          mvn -B help:effective-pom \
            > migration-report/effective-pom.xml 2> migration-report/effective-pom-errors.log
          EFFECTIVE_CODE=$?

          mvn -B validate \
            > migration-report/maven-validate.log 2>&1
          VALIDATE_CODE=$?

          POM_STATUS="❌ FAILED"
          if [ "$EFFECTIVE_CODE" -eq 0 ] && [ "$VALIDATE_CODE" -eq 0 ]; then
            POM_STATUS="✅ OK"
          fi

          echo "POM_STATUS=$POM_STATUS" >> "$GITHUB_ENV"
          exit 0

      - name: ⏳ Wait PostgreSQL
        run: |
          for i in {1..60}; do
            if pg_isready -h localhost -p 5432 -U postgres -d lotodb; then
              echo "✅ PostgreSQL ready"
              exit 0
            fi
            sleep 2
          done
          echo "❌ PostgreSQL not ready"
          exit 1

      - name: ⏳ Wait MongoDB
        run: |
          for i in {1..60}; do
            if nc -z localhost 27017; then
              echo "✅ MongoDB ready"
              exit 0
            fi
            sleep 2
          done
          echo "❌ MongoDB not ready"
          exit 1

      - name: 📦 Maven dependency audit
        continue-on-error: true
        run: |
          set +e
          mvn -B versions:display-dependency-updates > migration-report/dependency-updates.txt 2>&1
          mvn -B versions:display-plugin-updates > migration-report/plugin-updates.txt 2>&1
          mvn -B versions:display-property-updates > migration-report/property-updates.txt 2>&1
          mvn -B dependency:tree > migration-report/dependency-tree.txt 2>&1
          mvn -B dependency:analyze > migration-report/dependency-analyze.txt 2>&1
          exit 0

      - name: 🏗 Compile
        continue-on-error: true
        run: |
          set +e
          mvn -B clean compile \
            -Dspring.profiles.active=ci \
            > migration-report/compile.log 2>&1

          CODE=$?
          STATUS="❌ FAILED"
          [ "$CODE" -eq 0 ] && STATUS="✅ OK"

          echo "COMPILE_STATUS=$STATUS" >> "$GITHUB_ENV"
          exit 0

      - name: 🧪 Unit tests
        continue-on-error: true
        env:
          SPRING_PROFILES_ACTIVE: ci
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lotodb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATA_MONGODB_URI: mongodb://mongotest:mongotest@localhost:27017/lotodb_test?authSource=admin
        run: |
          set +e
          mvn -B test \
            -Dspring.profiles.active=ci \
            -Dsurefire.failIfNoSpecifiedTests=false \
            > migration-report/unit-tests.log 2>&1

          CODE=$?
          STATUS="❌ FAILED"
          [ "$CODE" -eq 0 ] && STATUS="✅ OK"

          echo "UNIT_STATUS=$STATUS" >> "$GITHUB_ENV"
          exit 0

      - name: 🔗 Integration tests
        continue-on-error: true
        env:
          SPRING_PROFILES_ACTIVE: ci
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lotodb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATA_MONGODB_URI: mongodb://mongotest:mongotest@localhost:27017/lotodb_test?authSource=admin
        run: |
          set +e
          mvn -B failsafe:integration-test failsafe:verify \
            -Dspring.profiles.active=ci \
            -Dsurefire.failIfNoSpecifiedTests=false \
            > migration-report/integration-tests.log 2>&1

          CODE=$?
          STATUS="❌ FAILED"
          [ "$CODE" -eq 0 ] && STATUS="✅ OK"

          echo "INTEGRATION_STATUS=$STATUS" >> "$GITHUB_ENV"
          exit 0

      - name: 🧾 Generate row report
        run: |
          ROW_FILE="row-java${{ matrix.java }}-springboot${{ matrix.spring_boot }}.md"

          echo "| Java 21 / Spring Boot 3.2.3 | Java ${{ matrix.java }} / Spring Boot ${{ matrix.spring_boot }} | ${{ matrix.expected }} | ${{ matrix.migration_level }} | $POM_STATUS | $COMPILE_STATUS | $UNIT_STATUS | $INTEGRATION_STATUS |" > "$ROW_FILE"

          {
            echo "# Rapport exploratoire"
            echo ""
            echo "- POM actuel : Java 21 / Spring Boot 3.2.3"
            echo "- POM patché : Java ${{ matrix.java }} / Spring Boot ${{ matrix.spring_boot }}"
            echo "- Objectif : ${{ matrix.expected }}"
            echo "- Niveau : ${{ matrix.migration_level }}"
            echo "- Validation POM : $POM_STATUS"
            echo "- Compilation : $COMPILE_STATUS"
            echo "- Tests unitaires : $UNIT_STATUS"
            echo "- Tests d'intégration : $INTEGRATION_STATUS"
          } > migration-report/result-summary.md

          echo "ROW_FILE=$ROW_FILE" >> "$GITHUB_ENV"

      - name: 📤 Upload row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: row-java${{ matrix.java }}-springboot${{ matrix.spring_boot }}
          path: ${{ env.ROW_FILE }}
          retention-days: 30

      - name: 📤 Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-report-java${{ matrix.java }}-springboot${{ matrix.spring_boot }}
          path: migration-report/
          retention-days: 30

  summary:
    name: 📊 Final Migration Report
    runs-on: ubuntu-latest
    needs: exploratory
    if: always()

    steps:
      - name: 📥 Download rows
        uses: actions/download-artifact@v4
        with:
          pattern: row-*
          path: rows
          merge-multiple: true

      - name: 📊 Build final migration report
        run: |
          mkdir -p exploratory-report

          TOTAL=$(ls rows/*.md 2>/dev/null | wc -l | tr -d ' ')
          POM_OK=$(awk -F'|' '{print $6}' rows/*.md 2>/dev/null | grep -c "OK" || true)
          COMPILE_OK=$(awk -F'|' '{print $7}' rows/*.md 2>/dev/null | grep -c "OK" || true)
          UNIT_OK=$(awk -F'|' '{print $8}' rows/*.md 2>/dev/null | grep -c "OK" || true)
          INTEGRATION_OK=$(awk -F'|' '{print $9}' rows/*.md 2>/dev/null | grep -c "OK" || true)

          {
            echo "# 🧪 Rapport final - Migration exploratoire Java / Spring Boot"
            echo ""
            echo "## Tableau de compatibilité"
            echo ""
            echo "| POM actuel | POM patché | Objectif | Niveau | Validation POM | Compilation | Tests unitaires | Tests intégration |"
            echo "|---|---|---|---|---|---|---|---|"

            if ls rows/*.md >/dev/null 2>&1; then
              sort rows/*.md
            else
              echo "| Aucun résultat | - | - | - | ❌ | ❌ | ❌ | ❌ |"
            fi

            echo ""
            echo "## Synthèse"
            echo ""
            echo "| Élément | Valeur |"
            echo "|---|---|"
            echo "| Configurations testées | $TOTAL |"
            echo "| Socle stable actuel | Java 21 / Spring Boot 3.2.3 |"
            echo "| POM patchés valides | $POM_OK/$TOTAL |"
            echo "| Compilations réussies | $COMPILE_OK/$TOTAL |"
            echo "| Tests unitaires réussis | $UNIT_OK/$TOTAL |"
            echo "| Tests d'intégration réussis | $INTEGRATION_OK/$TOTAL |"
            echo "| PostgreSQL utilisé | 17 |"
            echo "| MongoDB utilisé | 8 |"
            echo "| Environnement CI | Ubuntu 24.04 |"
            echo "| Outil CI/CD | GitHub Actions |"
            echo "| Objectif | Préparer les migrations futures Java / Spring Boot |"
            echo "| Artifacts générés | POM patché, effective-pom, logs Maven, dependency tree, plugin updates, dependency updates, property updates |"

            echo ""
            echo "## Interprétation"
            echo ""
            echo "La validation du POM indique que Maven accepte la configuration patchée."
            echo "La compilation permet d'identifier les incompatibilités de code ou de dépendances."
            echo "Les tests unitaires vérifient le comportement fonctionnel isolé."
            echo "Les tests d'intégration vérifient le comportement avec PostgreSQL, MongoDB et le contexte Spring."
            echo "Ce workflow ne migre pas automatiquement le projet, mais fournit une base d'analyse pour préparer une migration maîtrisée."
          } > exploratory-report/exploratory-summary.md

          cat exploratory-report/exploratory-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 📄 Generate CSV report
        run: |
          {
            echo "POM actuel,POM patché,Objectif,Niveau,Validation POM,Compilation,Tests unitaires,Tests integration"
            if ls rows/*.md >/dev/null 2>&1; then
              cat rows/*.md \
                | sed 's/^| //' \
                | sed 's/ |$//' \
                | sed 's/ | /,/g' \
                | sort
            fi
          } > exploratory-report/exploratory-summary.csv

      - name: 📤 Upload final exploratory report
        uses: actions/upload-artifact@v4
        with:
          name: exploratory-final-report
          path: exploratory-report/
          retention-days: 30
