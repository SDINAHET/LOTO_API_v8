name: 🧪 Compatibility Matrix - Loto Tracker

on:
  workflow_dispatch:
  push:
    # branches:
    #   - refactor-last20-last6
    #   - main
  pull_request:

jobs:
  compatibility:
    name: ${{ matrix.os }} / Java ${{ matrix.java }} / PG ${{ matrix.postgres }} / Mongo ${{ matrix.mongo }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true

    # strategy:
    #   fail-fast: false
    strategy:
      fail-fast: false
    #   max-parallel: 1
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        #java: [21, 24, 25]
        java: [21]
        postgres: [14, 15, 16, 17]
        mongo: [6, 7, 8]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: lotodb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lotodb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

      mongodb:
        image: mongo:${{ matrix.mongo }}
        env:
          MONGO_INITDB_ROOT_USERNAME: mongotest
          MONGO_INITDB_ROOT_PASSWORD: mongotest
          MONGO_INITDB_DATABASE: lotodb_test
        ports:
          - 27017:27017

    steps:
      - name: 🛠 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: 🧰 Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq netcat-openbsd postgresql-client

      - name: ⏳ Wait PostgreSQL
        run: |
          for i in {1..60}; do
            if pg_isready -h localhost -p 5432 -U postgres -d lotodb; then
              echo "✅ PostgreSQL ready"
              exit 0
            fi
            sleep 2
          done
          echo "❌ PostgreSQL not ready"
          exit 1

      - name: ⏳ Wait MongoDB
        run: |
          for i in {1..60}; do
            if nc -z localhost 27017; then
              echo "✅ MongoDB ready"
              exit 0
            fi
            sleep 2
          done
          echo "❌ MongoDB not ready"
          exit 1

      - name: 🧪 Compatibility Test
        id: compat
        continue-on-error: true
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lotodb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATA_MONGODB_URI: mongodb://mongotest:mongotest@localhost:27017/lotodb_test?authSource=admin
        run: |
          set +e

          mvn -B clean test \
          # mvn -B clean verify \
            -Dspring.profiles.active=ci \
            -Dsurefire.failIfNoSpecifiedTests=false \
            > compatibility.log 2>&1

          CODE=$?

          if [ "$CODE" -eq 0 ]; then
            STATUS="✅ OK"
            RAW_STATUS="OK"
          else
            STATUS="❌ FAILED"
            RAW_STATUS="FAILED"
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "raw_status=$RAW_STATUS" >> "$GITHUB_OUTPUT"

          ROW_FILE="row-${{ matrix.os }}-java${{ matrix.java }}-pg${{ matrix.postgres }}-mongo${{ matrix.mongo }}.md"

          echo "| ${{ matrix.os }} | Java ${{ matrix.java }} | PostgreSQL ${{ matrix.postgres }} | MongoDB ${{ matrix.mongo }} | $STATUS |" > "$ROW_FILE"

          echo "ROW_FILE=$ROW_FILE" >> "$GITHUB_ENV"

          exit 0

      - name: 📤 Upload row
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: row-${{ matrix.os }}-java${{ matrix.java }}-pg${{ matrix.postgres }}-mongo${{ matrix.mongo }}
            path: ${{ env.ROW_FILE }}
            retention-days: 30

      - name: 📤 Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.os }}-java${{ matrix.java }}-pg${{ matrix.postgres }}-mongo${{ matrix.mongo }}
          path: compatibility.log
          retention-days: 30

  summary:
    name: 📊 Global Compatibility Table
    runs-on: ubuntu-latest
    needs: compatibility
    if: always()

    steps:
      - name: 📥 Download rows
        uses: actions/download-artifact@v4
        with:
          pattern: row-*
          path: rows
          merge-multiple: true

      - name: 📊 Build global reports
        run: |
          mkdir -p compatibility-report

          {
            echo "# 🧪 Tableau global de compatibilité"
            echo ""
            echo "| Ubuntu | Java | PostgreSQL | MongoDB | Résultat |"
            echo "|---|---|---|---|---|"

            if ls rows/*.md >/dev/null 2>&1; then
              sort rows/*.md
            else
              echo "| Aucun résultat | - | - | - | ❌ |"
            fi
          } > compatibility-report/compatibility-summary.md

          {
            echo "Ubuntu,Java,PostgreSQL,MongoDB,Result"
            if ls rows/*.md >/dev/null 2>&1; then
              cat rows/*.md \
                | sed 's/^| //' \
                | sed 's/ |$//' \
                | sed 's/ | /,/g' \
                | sort
            fi
          } > compatibility-report/compatibility-summary.csv

          cat compatibility-report/compatibility-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload global compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-global-report
          path: compatibility-report/
          retention-days: 30
